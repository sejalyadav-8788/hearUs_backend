<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>hearUs | Authority Dashboard</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #172033;
        }

        /* ================= HEADER ================= */

        .header {
            height: 72px;
            background: #172554;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 38px;

            box-shadow: 0 3px 12px rgba(15, 23, 42, 0.15);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 40px;
            height: 40px;

            border-radius: 10px;
            background: #3b82f6;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;
            font-weight: bold;
        }

        .brand h1 {
            font-size: 21px;
            letter-spacing: 0.3px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .authority-badge {
            display: flex;
            align-items: center;
            gap: 8px;

            font-size: 14px;
            color: #dbeafe;
        }

        .online-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #22c55e;
        }

        .logout-btn {
            border: none;
            background: #ef4444;
            color: white;

            padding: 9px 17px;
            border-radius: 7px;

            font-weight: 600;
            cursor: pointer;

            transition: 0.2s;
        }

        .logout-btn:hover {
            background: #dc2626;
            transform: translateY(-1px);
        }


        /* ================= MAIN ================= */

        .container {
            max-width: 1250px;
            margin: auto;
            padding: 35px 28px 50px;
        }

        .welcome {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;

            margin-bottom: 28px;
        }

        .welcome h2 {
            font-size: 28px;
            color: #172033;
            margin-bottom: 7px;
        }

        .welcome p {
            color: #64748b;
            font-size: 15px;
        }

        .date {
            color: #64748b;
            font-size: 14px;
        }


        /* ================= STAT CARDS ================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;

            margin-bottom: 28px;
        }

        .stat-card {
            background: white;

            padding: 21px;

            border-radius: 12px;

            border: 1px solid #e5e7eb;

            box-shadow: 0 3px 10px rgba(15, 23, 42, 0.05);

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-info p {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .stat-info h3 {
            font-size: 27px;
            color: #172033;
        }

        .stat-icon {
            width: 45px;
            height: 45px;

            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;
        }

        .blue {
            background: #dbeafe;
            color: #2563eb;
        }

        .orange {
            background: #ffedd5;
            color: #ea580c;
        }

        .green {
            background: #dcfce7;
            color: #16a34a;
        }

        .red {
            background: #fee2e2;
            color: #dc2626;
        }


        /* ================= COMPLAINT PANEL ================= */

        .complaints-section {
            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 14px;

            box-shadow: 0 3px 12px rgba(15, 23, 42, 0.05);

            overflow: hidden;
        }

        .section-header {
            padding: 22px 25px;

            border-bottom: 1px solid #e5e7eb;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-header h2 {
            font-size: 19px;
        }

        .section-header p {
            color: #64748b;
            font-size: 13px;
            margin-top: 4px;
        }

        .refresh-btn {
            background: #eff6ff;
            color: #2563eb;

            border: 1px solid #bfdbfe;

            padding: 8px 14px;
            border-radius: 7px;

            cursor: pointer;
            font-weight: 600;

            transition: 0.2s;
        }

        .refresh-btn:hover {
            background: #dbeafe;
        }


        /* ================= MESSAGE ================= */

        .message {
            margin: 20px 25px;
            color: #dc2626;
            font-size: 14px;
        }


        /* ================= COMPLAINT LIST ================= */

        #complaintList {
            padding: 23px 25px;
        }

        .complaint {
            border: 1px solid #e2e8f0;

            border-radius: 12px;

            padding: 22px;

            margin-bottom: 18px;

            transition: 0.2s;

            background: #ffffff;
        }

        .complaint:hover {
            border-color: #bfdbfe;
            box-shadow: 0 5px 18px rgba(37, 99, 235, 0.08);
            transform: translateY(-1px);
        }

        .complaint:last-child {
            margin-bottom: 0;
        }

        .complaint-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;

            margin-bottom: 12px;
        }

        .complaint-title {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .complaint-number {
            width: 34px;
            height: 34px;

            border-radius: 8px;

            background: #eff6ff;
            color: #2563eb;

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: bold;
            font-size: 13px;
        }

        .complaint h3 {
            font-size: 17px;
            color: #172033;
        }

        .status {
            display: inline-flex;
            padding: 6px 11px;

            border-radius: 20px;

            background: #f1f5f9;

            color: #475569;

            font-weight: 600;
            font-size: 12px;
        }

        .complaint-description {
            color: #64748b;

            font-size: 14px;

            line-height: 1.6;

            margin: 12px 0 18px;
        }


        /* ================= DETAILS ================= */

        .details-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);

            gap: 12px;

            margin-bottom: 18px;
        }

        .detail {
            background: #f8fafc;

            border-radius: 8px;

            padding: 11px 13px;
        }

        .detail-label {
            display: block;

            color: #94a3b8;

            font-size: 11px;

            text-transform: uppercase;

            letter-spacing: 0.4px;

            margin-bottom: 4px;
        }

        .detail-value {
            color: #334155;

            font-size: 13px;

            font-weight: 600;
        }


        /* ================= PRIORITY ================= */

        .priority-high {
            color: #dc2626;
        }

        .priority-medium {
            color: #d97706;
        }

        .priority-low {
            color: #16a34a;
        }


        /* ================= ACTIONS ================= */

        .complaint-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding-top: 15px;

            border-top: 1px solid #f1f5f9;
        }

        .deadline {
            color: #64748b;
            font-size: 12px;
        }

        .actions {
            display: flex;
            gap: 9px;
        }

        .actions button {
            border: none;

            padding: 9px 15px;

            border-radius: 7px;

            cursor: pointer;

            color: white;

            font-size: 13px;

            font-weight: 600;

            transition: 0.2s;
        }

        .progress-btn {
            background: #2563eb;
        }

        .progress-btn:hover {
            background: #1d4ed8;
        }

        .resolve-btn {
            background: #16a34a;
        }

        .resolve-btn:hover {
            background: #15803d;
        }


        /* ================= EMPTY STATE ================= */

        .empty-state {
            text-align: center;

            padding: 55px 20px;

            color: #64748b;
        }

        .empty-icon {
            width: 60px;
            height: 60px;

            margin: auto auto 15px;

            border-radius: 50%;

            background: #f1f5f9;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 25px;
        }

        .empty-state h3 {
            color: #334155;
            margin-bottom: 6px;
        }


        /* ================= LOADING ================= */

        .loading {
            text-align: center;
            padding: 45px;
            color: #64748b;
        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 900px) {

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .details-grid {
                grid-template-columns: repeat(2, 1fr);
            }

        }


        @media (max-width: 650px) {

            .header {
                padding: 0 18px;
            }

            .authority-badge {
                display: none;
            }

            .container {
                padding: 25px 15px 40px;
            }

            .welcome {
                display: block;
            }

            .date {
                margin-top: 8px;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .stat-card {
                padding: 15px;
            }

            .stat-info h3 {
                font-size: 22px;
            }

            .stat-icon {
                width: 37px;
                height: 37px;
            }

            .complaint-top {
                display: block;
            }

            .complaint-top .status {
                margin-top: 12px;
            }

            .details-grid {
                grid-template-columns: 1fr;
            }

            .complaint-footer {
                display: block;
            }

            .actions {
                margin-top: 13px;
            }

            .actions button {
                flex: 1;
            }

        }

    
        /* ===== toasts ===== */
        .toast-wrap{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:10px;z-index:9999;max-width:340px}
        .toast{padding:12px 16px;border-radius:10px;color:#fff;font:600 14px "Segoe UI",Arial,sans-serif;box-shadow:0 8px 24px rgba(15,23,42,.25);animation:toastIn .25s ease;background:#1e293b}
        .toast.ok{background:#16a34a}.toast.warn{background:#d97706}.toast.error{background:#dc2626}
        @keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
        @media (prefers-reduced-motion:reduce){.toast{animation:none}}

        /* ================= ML INSIGHTS ================= */
        .ml-insights { margin-top: 14px; padding: 12px 14px; border: 1px dashed #b9c7d6; border-radius: 10px; background: #f7fafc; font-size: 13px; }
        .ml-insights.ml-none { color: #8a96a3; font-style: italic; }
        .ml-title { font-weight: 700; color: #34495e; margin-bottom: 8px; letter-spacing: .3px; }
        .ml-chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .ml-chip { padding: 4px 10px; border-radius: 999px; background: #e8eef4; color: #2c3e50; font-weight: 600; font-size: 12px; }
        .ml-chip.ml-urg-critical, .ml-chip.ml-danger { background: #fde2e2; color: #b42318; }
        .ml-chip.ml-urg-high, .ml-chip.ml-warn { background: #fff1d6; color: #9a5b00; }
        .ml-chip.ml-urg-medium, .ml-chip.ml-info { background: #e0efff; color: #1d4f91; }
        .ml-chip.ml-urg-low { background: #e3f6ea; color: #1e7a43; }
        .ml-line { margin-top: 8px; color: #4a5a6a; }
        .ml-line.ml-review { color: #9a5b00; }
    </style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="header">

    <div class="brand">

        <div class="brand-icon">
            hU
        </div>

        <h1>hearUs</h1>

    </div>


    <div class="header-right">

        <div class="authority-badge">

            <span class="online-dot"></span>

            Authority Portal

        </div>


        <button
            class="logout-btn"
            onclick="logout()">

            Logout

        </button>

    </div>

</header>



<!-- ================= MAIN ================= -->

<main class="container">


    <!-- Welcome -->

    <div class="welcome">

        <div>

            <h2>Authority Dashboard</h2>

            <p>
                Manage, track and resolve campus complaints.
            </p>

        </div>

        <div
            class="date"
            id="currentDate">
        </div>

    </div>



    <!-- ================= STATISTICS ================= -->

    <div class="stats">

        <div class="stat-card">

            <div class="stat-info">

                <p>Total Complaints</p>

                <h3 id="totalCount">0</h3>

            </div>

            <div class="stat-icon blue">
                📋
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-info">

                <p>Pending</p>

                <h3 id="pendingCount">0</h3>

            </div>

            <div class="stat-icon orange">
                ⏳
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-info">

                <p>In Progress</p>

                <h3 id="progressCount">0</h3>

            </div>

            <div class="stat-icon blue">
                ⚙
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-info">

                <p>Resolved</p>

                <h3 id="resolvedCount">0</h3>

            </div>

            <div class="stat-icon green">
                ✓
            </div>

        </div>

    </div>



    <!-- ================= COMPLAINTS ================= -->

    <section class="complaints-section">


        <div class="section-header">

            <div>

                <h2>Assigned Complaints</h2>

                <p>
                    Complaints currently assigned to your department.
                </p>

            </div>


            <button
                class="refresh-btn"
                onclick="loadComplaints()">

                ↻ Refresh

            </button>

        </div>



        <div
            id="message"
            class="message">
        </div>



        <div id="complaintList">

            <div class="loading">
                Loading complaints...
            </div>

        </div>


    </section>


</main>



<script>

    /* ================= TOASTS ================= */

    function toast(msg, type) {
        let wrap = document.querySelector(".toast-wrap");
        if (!wrap) {
            wrap = document.createElement("div");
            wrap.className = "toast-wrap";
            wrap.setAttribute("role", "status");
            document.body.appendChild(wrap);
        }
        const t = document.createElement("div");
        t.className = "toast " + (type || "");
        t.textContent = msg;
        wrap.appendChild(t);
        setTimeout(() => {
            t.style.transition = "opacity .3s";
            t.style.opacity = "0";
            setTimeout(() => t.remove(), 300);
        }, 4500);
    }



    /* ================= CONFIG ================= */

    const API_URL = "http://localhost:8081";
    const token =
        localStorage.getItem("authorityToken");


    /* ================= LOGIN CHECK ================= */

    if (!token) {

        alert("Please login first.");

        window.location.href = "login.html";

    }


    /* ================= DATE ================= */

    document.getElementById("currentDate").innerText =
        new Date().toLocaleDateString("en-IN", {

            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"

        });



    /* ================= LOAD COMPLAINTS ================= */

    async function loadComplaints() {

        const complaintList =
            document.getElementById("complaintList");

        const message =
            document.getElementById("message");


        message.innerText = "";

        complaintList.innerHTML = `
            <div class="loading">
                Loading complaints...
            </div>
        `;


        try {

            const response = await fetch(

                API_URL +
                "/api/authority/complaints",

                {

                    headers: {

                        "Authorization":
                            "Bearer " + token

                    }

                }

            );


            if (!response.ok) {

                if (response.status === 403) {

                    throw new Error(
                        "You do not have authority access."
                    );

                }

                throw new Error(
                    "Failed to load complaints."
                );

            }


            const complaints =
                await response.json();


            updateStatistics(complaints);


            if (
                !complaints ||
                complaints.length === 0
            ) {

                complaintList.innerHTML = `

                    <div class="empty-state">

                        <div class="empty-icon">
                            ✓
                        </div>

                        <h3>No complaints assigned</h3>

                        <p>
                            There are currently no complaints
                            requiring your attention.
                        </p>

                    </div>

                `;

                return;

            }


            complaintList.innerHTML =

                complaints.map(
                    (c, index) => createComplaintCard(c, index)
                ).join("");


        }

        catch (error) {

            console.error(error);

            message.innerText =
                error.message;

            complaintList.innerHTML = "";

        }

    }



    /* ================= COMPLAINT CARD ================= */

    function createComplaintCard(c, index) {

        const priority =
            String(c.priority || "NORMAL").toUpperCase();


        let priorityClass = "priority-medium";


        if (priority === "HIGH" || priority === "URGENT") {

            priorityClass = "priority-high";

        }

        else if (priority === "LOW") {

            priorityClass = "priority-low";

        }


        const deadline = c.deadline

            ? new Date(c.deadline).toLocaleString("en-IN")

            : "Not assigned";


        return `

            <div class="complaint">


                <div class="complaint-top">


                    <div class="complaint-title">


                        <div class="complaint-number">

                            ${String(index + 1).padStart(2, "0")}

                        </div>


                        <h3>

                            ${escapeHtml(c.title)}

                        </h3>


                    </div>


                    <span class="status">

                        ${escapeHtml(c.status || "PENDING")}

                    </span>


                </div>



                <p class="complaint-description">

                    ${escapeHtml(c.description || "No description provided.")}

                </p>



                <div class="details-grid">


                    <div class="detail">

                        <span class="detail-label">
                            Category
                        </span>

                        <span class="detail-value">
                            ${escapeHtml(c.category || "N/A")}
                        </span>

                    </div>



                    <div class="detail">

                        <span class="detail-label">
                            Subcategory
                        </span>

                        <span class="detail-value">
                            ${escapeHtml(c.subcategory || "N/A")}
                        </span>

                    </div>



                    <div class="detail">

                        <span class="detail-label">
                            Priority
                        </span>

                        <span class="detail-value ${priorityClass}">
                            ${escapeHtml(priority)}
                        </span>

                    </div>



                    <div class="detail">

                        <span class="detail-label">
                            Department
                        </span>

                        <span class="detail-value">
                            ${escapeHtml(c.department || "N/A")}
                        </span>

                    </div>



                    <div class="detail">

                        <span class="detail-label">
                            Location
                        </span>

                        <span class="detail-value">
                            ${escapeHtml(c.location || "N/A")}
                        </span>

                    </div>



                    <div class="detail">

                        <span class="detail-label">
                            Deadline
                        </span>

                        <span class="detail-value">
                            ${deadline}
                        </span>

                    </div>


                    <div class="detail">

                        <span class="detail-label">
                            Escalation level
                        </span>

                        <span class="detail-value">
                            ${c.escalationLevel > 0 ? "Level " + c.escalationLevel : "Not escalated"}
                        </span>

                    </div>


                </div>



                ${mlInsightsHtml(c)}

                <div class="complaint-footer">


                    <div class="deadline">

                        Complaint ID:
                        <strong>#${c.id}</strong>

                    </div>



                    <div class="actions">


                        <button
                            class="progress-btn"
                            onclick="updateStatus(
                                ${c.id},
                                'IN_PROGRESS'
                            )">

                            Start Working

                        </button>



                        <button
                            class="resolve-btn"
                            onclick="updateStatus(
                                ${c.id},
                                'RESOLVED'
                            )">

                            Mark Resolved

                        </button>


                    </div>


                </div>


            </div>

        `;

    }



    /* ================= STATISTICS ================= */

    function updateStatistics(complaints) {

        const total =
            complaints.length;


        const pending =
            complaints.filter(
                c => ["OPEN", "ASSIGNED", "ESCALATED"].includes(
                    String(c.status).toUpperCase()
                )
            ).length;


        const progress =
            complaints.filter(
                c =>
                    String(c.status).toUpperCase() ===
                    "IN_PROGRESS"
            ).length;


        const resolved =
            complaints.filter(
                c =>
                    String(c.status).toUpperCase() ===
                    "RESOLVED"
            ).length;


        document.getElementById("totalCount").innerText =
            total;

        document.getElementById("pendingCount").innerText =
            pending;

        document.getElementById("progressCount").innerText =
            progress;

        document.getElementById("resolvedCount").innerText =
            resolved;

    }



    /* ================= UPDATE STATUS ================= */

    async function updateStatus(
        complaintId,
        status
    ) {

        const action =
            status === "RESOLVED"
                ? "mark this complaint as resolved"
                : "move this complaint to in progress";


        const confirmed =
            confirm(
                "Are you sure you want to " +
                action +
                "?"
            );


        if (!confirmed) {
            return;
        }


        try {

            const response = await fetch(

                API_URL +
                "/api/complaints/" +
                complaintId +
                "/status?status=" +
                status,

                {

                    method: "PUT",

                    headers: {

                        "Authorization":
                            "Bearer " + token

                    }

                }

            );


            if (!response.ok) {

                let reason = "Unable to update complaint.";
                try {
                    const body = await response.json();
                    if (body && body.error) reason = body.error;
                } catch (e) { /* keep the default message */ }
                throw new Error(reason);

            }


            toast(status === "RESOLVED" ? "Complaint marked as resolved." : "Complaint moved to in progress.", "ok");


            await loadComplaints();


        }

        catch (error) {

            console.error(error);

            toast(error.message, "error");

        }

    }



    /* ================= SECURITY ================= */

    /* ================= ML INSIGHTS ================= */

    // Shows what the HearUs ML service found for a complaint.
    function mlInsightsHtml(c) {
        if (!c.mlCategory && !c.mlUrgency) {
            return `<div class="ml-insights ml-none">ML check: not available for this complaint (ML service was off when it was submitted)</div>`;
        }
        const chips = [];
        const urgency = String(c.mlUrgency || "").toLowerCase();
        chips.push(`<span class="ml-chip ml-urg-${urgency}">Urgency: ${escapeHtml(c.mlUrgency || "-")}</span>`);
        const confidence = c.mlConfidence != null ? ` (${Math.round(c.mlConfidence * 100)}%)` : "";
        chips.push(`<span class="ml-chip">Category: ${escapeHtml(c.mlCategory || "-")}${confidence}</span>`);
        String(c.mlSafetyFlags || "").split(",").filter(Boolean).forEach(flag => {
            chips.push(`<span class="ml-chip ml-danger">Safety: ${escapeHtml(flag)}</span>`);
        });
        if (c.sensitive) chips.push(`<span class="ml-chip ml-danger">Sensitive</span>`);
        if (c.mlProfane) chips.push(`<span class="ml-chip ml-warn">Abusive language</span>`);
        if (c.mlDuplicateOf) {
            const ids = String(c.mlDuplicateOf).split(",").filter(Boolean).map(id => "#" + escapeHtml(id)).join(", ");
            chips.push(`<span class="ml-chip ml-info">Similar to ${ids}</span>`);
        }
        let lines = "";
        if (c.mlNotify) lines += `<div class="ml-line"><strong>Notify:</strong> ${escapeHtml(c.mlNotify)}</div>`;
        if (c.mlNeedsReview) lines += `<div class="ml-line ml-review"><strong>Needs review:</strong> ${escapeHtml(c.mlReviewReasons || "yes")}</div>`;
        return `<div class="ml-insights"><div class="ml-title">ML insights</div><div class="ml-chips">${chips.join("")}</div>${lines}</div>`;
    }

    function escapeHtml(value) {

        const div =
            document.createElement("div");

        div.textContent =
            value;

        return div.innerHTML;

    }



    /* ================= LOGOUT ================= */

    function logout() {

        localStorage.removeItem(
            "authorityToken"
        );

        window.location.href =
            "login.html";

    }



    /* ================= ROLE-AWARE HEADING ================= */

    async function setTitle() {
        try {
            const r = await fetch(API_URL + "/api/auth/me", {
                headers: { "Authorization": "Bearer " + token }
            });
            if (!r.ok) return;
            const me = await r.json();
            const role = (me.role || "").toUpperCase();

            const names = { COORDINATOR: "Coordinator", WARDEN: "Warden", HOD: "HOD",
                            DEAN: "Dean", FACULTY: "Faculty", ADMIN: "Admin" };
            const intro = {
                COORDINATOR: "Complaints from your department reach you first. Resolve them before the deadline.",
                HOD: "Complaints the Coordinator did not resolve in time are escalated to you.",
                WARDEN: "Hostel complaints reach you first. Resolve them before the deadline.",
                DEAN: "Sensitive and escalated complaints reach you here.",
                FACULTY: "Complaints assigned to you.",
                ADMIN: "Complaints that have been escalated all the way up reach you here."
            };

            const label = names[role] || "Authority";
            document.querySelector(".welcome h2").innerText = label + " Dashboard";
            document.querySelector(".welcome p").innerText =
                (intro[role] || "") + (me.department ? "  Department: " + me.department : "");
            document.querySelector(".authority-badge").innerHTML =
                '<span class="online-dot"></span> ' + label + " Portal";
            document.title = "hearUs | " + label + " Dashboard";
        } catch (e) { console.error(e); }
    }


    /* ================= START ================= */

    setTitle();
    loadComplaints();


    /* ================= NEW-ASSIGNMENT ALERTS ================= */

    let knownIds = null;

    async function pollAssignments() {
        if (document.hidden) return;
        try {
            const r = await fetch(API_URL + "/api/authority/complaints", {
                headers: { "Authorization": "Bearer " + token }
            });
            if (!r.ok) return;
            const list = await r.json();
            if (knownIds) {
                const fresh = list.filter(c => !knownIds.has(c.id));
                if (fresh.length) {
                    toast("New complaint assigned: " + fresh[0].title +
                          (fresh.length > 1 ? " (+" + (fresh.length - 1) + " more)" : ""), "warn");
                    loadComplaints();
                }
            }
            knownIds = new Set(list.map(c => c.id));
        } catch (e) { /* ignore network blips */ }
    }

    pollAssignments();
    setInterval(pollAssignments, 15000);


</script>
